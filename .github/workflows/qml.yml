name: Qt and formatter
on: [push, pull_request]
permissions:
  contents: read
jobs:
  qml:
    runs-on: ubuntu-latest
    container: archlinux:base
    steps:
      - name: Install official distribution tools
        run: pacman -Syu --noconfirm --needed git python nodejs quickshell qt6-declarative
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: node qml/test-format.cjs
      - run: python scripts/check_qml.py
        env:
          QT_QPA_PLATFORM: offscreen
